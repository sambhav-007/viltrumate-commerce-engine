<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VCE Panel</title>
<style>
  :root {
    --ink: #1c1917; --muted: #78716c; --bg: #fafaf9; --card: #ffffff;
    --line: #e7e5e4; --accent: #0f766e; --accent-soft: #f0fdfa; --danger: #b91c1c;
    --amber: #92400e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 22px; background: var(--ink); color: #fff; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.14em; text-transform: uppercase; }
  header .sub { color: #a8a29e; font-size: 12px; }
  header .op { margin-left: auto; }
  header .op input { background: #292524; border: 1px solid #44403c; color: #fff; border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; width: 160px; }
  .wrap { display: grid; grid-template-columns: 270px 1fr; min-height: calc(100vh - 52px); }
  aside { border-right: 1px solid var(--line); background: var(--card); padding: 14px; }
  main { padding: 22px 26px; max-width: 1000px; }
  .nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-weight: 600; }
  .nav-item:hover { background: var(--bg); }
  .nav-item.active { background: var(--accent-soft); border: 1px solid var(--accent); }
  .store-item { padding: 9px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .store-item:hover { background: var(--bg); }
  .store-item.active { background: var(--accent-soft); border: 1px solid var(--accent); }
  .store-item .id { color: var(--muted); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
  input[type=text], input[type=email], input[type=number], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff;
  }
  textarea { font-family: Consolas, monospace; font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 16px; }
  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  .checks label { display: flex; align-items: center; gap: 7px; margin: 0; font-size: 13px; color: var(--ink); }
  button { padding: 9px 18px; border: none; border-radius: 7px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.small { padding: 5px 10px; font-size: 12px; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; }
  .swatch-row { display: flex; align-items: center; gap: 8px; }
  .swatch-row input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 8px; display: none; max-width: 480px; white-space: pre-wrap; }
  .muted { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 9px; font-size: 11px; margin-left: 6px; }
  .status { display: inline-block; border-radius: 99px; padding: 1px 9px; font-size: 11px; text-transform: capitalize; }
  .status.active { background: #ecfdf5; color: #047857; }
  .status.provisioning { background: #fffbeb; color: var(--amber); }
  .status.error { background: #fef2f2; color: var(--danger); }
  .status.inactive, .status.archived { background: #f5f5f4; color: var(--muted); }
  .locknote { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--amber); margin-bottom: 12px; }
  #login { max-width: 380px; margin: 12vh auto; }
  .stat-row { display: grid; grid-template-columns: 90px 70px 1fr 34px; gap: 8px; margin-bottom: 6px; align-items: center; }
  .stat-row button { padding: 6px 0; background: #fff; color: var(--danger); border: 1px solid var(--line); }
  hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  /* dashboard */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .badge { display: inline-block; border-radius: 99px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
  .badge.up-to-date { background: #ecfdf5; color: #047857; }
  .badge.migration-required { background: #fffbeb; color: var(--amber); }
  .badge.update-failed { background: #fef2f2; color: var(--danger); }
  .badge.unknown { background: #f5f5f4; color: var(--muted); }
  .wizard-steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .wstep { flex: 1; min-width: 90px; text-align: center; padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; color: var(--muted); background: #fff; }
  .wstep.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .wstep.done { border-color: #047857; color: #047857; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .kpi .n { font-size: 30px; font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .barrow { display: grid; grid-template-columns: 120px 1fr 40px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .bar { height: 10px; border-radius: 6px; background: var(--accent); }
  .bartrack { background: var(--bg); border-radius: 6px; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; align-items: baseline; }
  .log li:last-child { border-bottom: none; }
  .log .when { color: var(--muted); font-size: 11px; white-space: nowrap; min-width: 118px; }
  .log .who { color: var(--accent); font-size: 12px; }
  table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mini th, table.mini td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.mini th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  /* tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; cursor: pointer; border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; font-weight: 600; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv .k { color: var(--muted); }
  /* templates */
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tpl-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tpl-thumb { height: 96px; background: var(--accent-soft); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .tpl-body { padding: 12px 14px; }
</style>
</head>
<body>
<header>
  <h1>VCE Panel</h1>
  <span class="sub">agency control plane — platform database</span>
  <span class="op" id="opBox" style="display:none">
    <input type="text" id="opInput" placeholder="operator (for audit)" title="Recorded as the actor in the activity log" />
  </span>
</header>

<div id="login" style="display:none">
  <div class="card">
    <h2>Panel key</h2>
    <p class="muted">Printed in the terminal where the panel started (or your PANEL_KEY).</p>
    <input type="text" id="keyInput" placeholder="panel key" />
    <div style="margin-top:10px"><button onclick="saveKey()">Enter</button></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <aside>
    <div class="nav-item" id="navDash" onclick="showDashboard()">📊 Dashboard</div>
    <div class="nav-item" id="navTpl" onclick="showTemplates()">🧩 Templates</div>
    <div class="nav-item" id="navDiag" onclick="showDiagnostics()">🩺 Diagnostics</div>
    <button style="width:100%; margin:6px 0 12px" onclick="showCreate()">+ New store</button>
    <div id="storeList"></div>
  </aside>
  <main id="main"><p class="muted">Loading…</p></main>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let KEY = localStorage.getItem("vce_panel_key") || "";
let OPERATOR = localStorage.getItem("vce_panel_operator") || "";
let stores = [], current = null, S = null; // S = current settings doc
let storeMeta = null, storeDeployments = [], storeActivity = [];

const api = (path, opts = {}) =>
  fetch("/api" + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "x-panel-key": KEY,
      "x-panel-operator": OPERATOR || "panel",
      ...(opts.headers || {}),
    },
  }).then(async (r) => {
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    return d;
  });

const toast = (msg, ms = 3500) => {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.display = "none"), ms);
};

const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const fmtTime = (t) => { try { return new Date(t).toLocaleString(); } catch (e) { return t || ""; } };

function saveKey() {
  KEY = $("keyInput").value.trim();
  localStorage.setItem("vce_panel_key", KEY);
  boot();
}

async function boot() {
  try {
    const d = await api("/stores");
    stores = d.stores;
    $("login").style.display = "none";
    $("app").style.display = "grid";
    $("opBox").style.display = "block";
    $("opInput").value = OPERATOR;
    $("opInput").oninput = () => { OPERATOR = $("opInput").value.trim(); localStorage.setItem("vce_panel_operator", OPERATOR); };
    renderList();
    showDashboard();
  } catch (e) {
    $("login").style.display = "block";
    $("app").style.display = "none";
    if (KEY) toast("Key rejected: " + e.message);
  }
}

function renderList() {
  $("storeList").innerHTML = stores
    .map(
      (s) => `<div class="store-item ${current === s.id ? "active" : ""}" onclick="openStore('${s.id}')">
        <div><b>${esc(s.name || s.id)}</b>${s.industry ? `<span class="pill">${esc(s.industry)}</span>` : ""}${s.updateState && s.updateState !== "up-to-date" && s.updateState !== "unknown" ? `<span class="badge ${esc(s.updateState)}">●</span>` : ""}</div>
        <div class="id">${esc(s.db || s.id)}${s.source === "fleet" ? " · fleet" : ""}${s.currentVersion ? " · v" + esc(s.currentVersion) : ""}</div>
      </div>`
    )
    .join("") || '<p class="muted">No stores yet.</p>';
}

/* ---------- dashboard ---------- */
function setNav(id) {
  ["navDash", "navTpl", "navDiag"].forEach((n) => $(n) && $(n).classList.toggle("active", n === id));
}

async function showDashboard() {
  current = null; renderList();
  setNav("navDash");
  $("main").innerHTML = '<p class="muted">Loading dashboard…</p>';
  let d;
  try { d = await api("/dashboard"); } catch (e) { return ($("main").innerHTML = `<div class="card"><h2>Error</h2><p>${esc(e.message)}</p></div>`); }
  const inds = Object.entries(d.byIndustry || {}).sort((a, b) => b[1] - a[1]);
  const maxInd = Math.max(1, ...inds.map(([, n]) => n));
  $("main").innerHTML = `
  <div class="row" style="justify-content:space-between; margin-bottom:14px">
    <div><b style="font-size:17px">Agency dashboard</b>
      <span class="muted"> · ${d.platform ? "platform database" : "fleet registry (PLATFORM_DATABASE not set)"}</span></div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="n">${d.totalStores}</div><div class="l">Total stores</div></div>
    <div class="kpi"><div class="n">${d.activeStores}</div><div class="l">Active stores</div></div>
    <div class="kpi"><div class="n">v${esc(d.platformVersion || "—")}</div><div class="l">Latest VCE version</div></div>
    <div class="kpi"><div class="n" style="${(d.storesNeedingUpdate || []).length ? "color:var(--amber)" : ""}">${(d.storesNeedingUpdate || []).length}</div><div class="l">Stores needing update</div></div>
  </div>
  <div class="card"><h2>Stores requiring updates</h2>
    ${(d.storesNeedingUpdate || []).length ? `<table class="mini"><thead><tr><th>Store</th><th>Version</th><th>Pending</th><th>State</th><th></th></tr></thead>
      <tbody>${d.storesNeedingUpdate.map((s) => `<tr>
        <td><b>${esc(s.name || s.id)}</b></td><td>v${esc(s.currentVersion || "—")} → v${esc(d.platformVersion)}</td>
        <td>${s.pending} migration(s)</td><td><span class="badge ${esc(s.state)}">${esc(s.state)}</span></td>
        <td><a href="#" onclick="openStore('${s.id}');return false">open</a></td></tr>`).join("")}</tbody></table>`
      : '<p class="muted">✅ Every store is on the latest VCE version.</p>'}
  </div>
  ${(d.failedUpdates || []).length ? `<div class="card"><h2>Failed updates</h2>
    <table class="mini"><thead><tr><th>When</th><th>Store</th><th>Migration</th><th>Error</th></tr></thead>
    <tbody>${d.failedUpdates.map((m) => `<tr><td>${fmtTime(m.timestamp)}</td><td>${esc(m.storeId)}</td>
      <td>v${esc(m.migration)}</td><td class="muted">${esc(m.error || "")}</td></tr>`).join("")}</tbody></table></div>` : ""}
  <div class="card"><h2>Migration history</h2>
    ${(d.migrationHistory || []).length ? `<table class="mini"><thead><tr><th>When</th><th>Store</th><th>Migration</th><th>Result</th><th>Duration</th></tr></thead>
      <tbody>${d.migrationHistory.map((m) => `<tr><td>${fmtTime(m.timestamp)}</td><td>${esc(m.storeId)}</td>
        <td>v${esc(m.migration)}</td><td><span class="status ${m.result === "success" ? "active" : "error"}">${esc(m.result)}</span></td>
        <td>${m.duration}ms</td></tr>`).join("")}</tbody></table>` : '<p class="muted">No migrations run yet.</p>'}
  </div>
  <div class="card"><h2>Stores by industry</h2>
    ${inds.length ? inds.map(([k, n]) => `
      <div class="barrow"><span>${esc(k)}</span>
        <span class="bartrack"><span class="bar" style="width:${Math.round((n / maxInd) * 100)}%"></span></span>
        <span style="text-align:right">${n}</span></div>`).join("") : '<p class="muted">No stores yet.</p>'}
  </div>
  <div class="card"><h2>Recent activity</h2>
    ${renderActivityList(d.recentActivity)}
  </div>
  <div class="card"><h2>Latest deployments</h2>
    ${renderDeployTable(d.latestDeployments, true)}
  </div>`;
}

function renderActivityList(items) {
  if (!items || !items.length) return '<p class="muted">No activity recorded yet.</p>';
  return `<ul class="log">${items.map((a) => `
    <li><span class="when">${fmtTime(a.timestamp)}</span>
      <span><b>${esc(a.action)}</b>${a.storeId ? ` · <span class="who">${esc(a.storeId)}</span>` : ""}
      <span class="muted"> — ${esc(a.operator)}</span></span></li>`).join("")}</ul>`;
}

function renderDeployTable(items, withStore) {
  if (!items || !items.length) return '<p class="muted">No deployments recorded yet.</p>';
  return `<table class="mini"><thead><tr>
    ${withStore ? "<th>Store</th>" : ""}<th>When</th><th>Version</th><th>Commit</th><th>Env</th><th>By</th></tr></thead>
    <tbody>${items.map((d) => `<tr>
      ${withStore ? `<td>${esc(d.storeId)}</td>` : ""}
      <td>${fmtTime(d.deployedAt)}</td><td>${esc(d.version || "—")}</td>
      <td><code>${esc(d.gitCommit || "—")}</code></td><td>${esc(d.environment)}</td><td>${esc(d.deployedBy)}</td>
    </tr>`).join("")}</tbody></table>`;
}

/* ---------- create store ---------- */
async function showCreate(presetTemplate) {
  current = null; renderList(); setNav("");
  let industries = [], tpls = [];
  try { industries = (await api("/industries")).industries; } catch (e) {}
  try { tpls = (await api("/templates")).templates; } catch (e) {}
  const startMode = presetTemplate ? "template" : "blank";
  $("main").innerHTML = `
  <div class="card">
    <h2>Create a new store</h2>
    <p class="muted">Provisions the database, settings, admin user and starter categories,
    then registers the store in the platform database (and the fleet registry).
    Env files + deployment are step 2 (docs/DEPLOYMENT.md).</p>
    <label>Start from</label>
    <select id="c_mode" onchange="createModeChanged()">
      <option value="blank" ${startMode === "blank" ? "selected" : ""}>Blank</option>
      <option value="industry" ${startMode === "industry" ? "selected" : ""}>Industry preset</option>
      <option value="template" ${startMode === "template" ? "selected" : ""}>Template</option>
    </select>
    <div class="grid2">
      <div><label>Store name</label><input type="text" id="c_name" placeholder="KickCo" /></div>
      <div><label>Store id (lowercase, dashes)</label><input type="text" id="c_id" placeholder="kickco" /></div>
      <div id="c_industryWrap" style="display:none"><label>Industry preset</label>
        <select id="c_industry"><option value="">— none (generic) —</option>
        ${industries.map((i) => `<option>${esc(i)}</option>`).join("")}</select></div>
      <div id="c_templateWrap" style="display:none"><label>Template</label>
        <select id="c_template"><option value="">— choose a template —</option>
        ${tpls.map((t) => `<option value="${esc(t.slug)}" ${presetTemplate === t.slug ? "selected" : ""}>${esc(t.name)} (v${esc(t.version)})</option>`).join("")}</select></div>
      <div><label>Admin email</label><input type="email" id="c_email" placeholder="owner@kickco.com" /></div>
      <div><label>WhatsApp number (optional)</label><input type="text" id="c_wa" placeholder="9198xxxxxxxx" /></div>
      <div><label>Database name (optional)</label><input type="text" id="c_db" placeholder="vce-kickco" /></div>
    </div>
    <div style="margin-top:14px" class="row">
      <button id="c_go" onclick="createStore()">Provision store</button>
      <span class="muted">Takes a few seconds (creates the database).</span>
    </div>
  </div>`;
  $("c_name").addEventListener("input", () => {
    $("c_id").value = $("c_name").value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  });
  createModeChanged();
}

function createModeChanged() {
  const mode = $("c_mode").value;
  $("c_industryWrap").style.display = mode === "industry" ? "block" : "none";
  $("c_templateWrap").style.display = mode === "template" ? "block" : "none";
}

async function createStore(retry = false) {
  const btn = $("c_go"); btn.disabled = true; btn.textContent = "Provisioning…";
  const mode = $("c_mode").value;
  try {
    const d = await api("/stores", {
      method: "POST",
      body: JSON.stringify({
        id: $("c_id").value.trim(),
        storeName: $("c_name").value.trim(),
        industry: mode === "industry" ? ($("c_industry").value || undefined) : undefined,
        template: mode === "template" ? ($("c_template").value || undefined) : undefined,
        adminEmail: $("c_email").value.trim(),
        whatsappNumber: $("c_wa").value.trim(),
        dbName: $("c_db").value.trim() || undefined,
        retry,
      }),
    });
    stores = (await api("/stores")).stores;
    renderList();
    toast(`✅ ${d.success}\nAdmin: ${d.admin.email}\nPassword (save it now!): ${d.admin.password}`, 20000);
    openStore(d.id);
  } catch (e) {
    if (!retry && /already exists/.test(e.message) &&
        confirm("This store id is already registered (a previous provision may have failed). Re-run provisioning for it?")) {
      btn.disabled = false;
      return createStore(true);
    }
    toast("❌ " + e.message);
  }
  btn.disabled = false; btn.textContent = "Provision store";
}

/* ---------- templates gallery (Phase Μ) ---------- */
let templates = [];

async function showTemplates() {
  current = null; renderList(); setNav("navTpl");
  $("main").innerHTML = '<p class="muted">Loading templates…</p>';
  try { templates = (await api("/templates")).templates; }
  catch (e) { return ($("main").innerHTML = `<div class="card"><h2>Error</h2><p>${esc(e.message)}</p></div>`); }
  $("main").innerHTML = `
  <div class="row" style="justify-content:space-between; margin-bottom:14px">
    <div><b style="font-size:17px">Store templates</b> <span class="muted">· reusable blueprints (config only — never merchant data)</span></div>
    <div class="row">
      <button class="secondary" onclick="importTemplate()">Import JSON</button>
    </div>
  </div>
  <div class="tpl-grid">${templates.map(templateCard).join("") || '<p class="muted">No templates yet. Open a store → Overview → “Create template”.</p>'}</div>
  <div id="tplPreview"></div>`;
}

function templateCard(t) {
  return `<div class="tpl-card">
    <div class="tpl-thumb" style="${t.thumbnail ? `background-image:url('${esc(t.thumbnail)}')` : ""}">${t.thumbnail ? "" : "🧩"}</div>
    <div class="tpl-body">
      <div><b>${esc(t.name)}</b> <span class="pill">v${esc(t.version)}</span></div>
      <div class="muted">${t.industry ? esc(t.industry) + " · " : ""}used ${t.usageCount || 0}× · ${fmtTime(t.updatedAt)}</div>
      ${t.description ? `<div style="font-size:12px;margin-top:4px">${esc(t.description)}</div>` : ""}

async function exportTemplate(slug) {
  try {
    const r = await fetch(`/api/templates/${slug}/export`, { headers: { "x-panel-key": KEY, "x-panel-operator": OPERATOR || "panel" } });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.statusText); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${slug}-template.json`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast("✅ Exported");
  } catch (e) { toast("❌ " + e.message); }
}

async function deleteTemplate(slug, name) {
  if (!confirm(`Delete template "${name}"? Provisioned stores are unaffected.`)) return;
  try { await api(`/templates/${slug}`, { method: "DELETE" }); toast("✅ Deleted"); showTemplates(); }
  catch (e) { toast("❌ " + e.message); }
}

function importTemplate() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.onchange = async () => {
    const file = input.files[0]; if (!file) return;
    try {
      const obj = JSON.parse(await file.text());
      const d = await api("/templates/import", { method: "POST", body: JSON.stringify({ template: obj }) });
      toast("✅ " + d.success); showTemplates();
    } catch (e) {
      toast("❌ " + (e.message || "invalid JSON"));
    }
  };
  input.click();
}

/* ---------- store actions: template + clone (Phase Μ) ---------- */
function toggleAction(id) {
  const el = $(id); if (!el) return;
  el.style.display = el.style.display === "none" ? "block" : "none";
}

async function createTemplateFromStore(id) {
  const name = $("t_name").value.trim();
  if (!name) return toast("Template name is required");
  const include = {};
  document.querySelectorAll("[data-tinc]").forEach((i) => (include[i.dataset.tinc] = i.checked));
  try {
    const d = await api(`/stores/${id}/template`, { method: "POST", body: JSON.stringify({ name, description: $("t_desc").value.trim(), include }) });
    toast(`✅ ${d.success}`);
    toggleAction("actTemplate");
  } catch (e) { toast("❌ " + e.message); }
}

async function cloneStore(id, retry = false) {
  const newId = $("cl_id").value.trim(), name = $("cl_name").value.trim(), email = $("cl_email").value.trim();
  if (!newId || !name || !email) return toast("New name, id and admin email are required");
  const options = {};
  document.querySelectorAll("[data-clopt]").forEach((i) => (options[i.dataset.clopt] = i.checked));
  try {
    const d = await api(`/stores/${id}/clone`, {
      method: "POST",
      body: JSON.stringify({ id: newId, storeName: name, adminEmail: email, dbName: $("cl_db").value.trim() || undefined, options, retry }),
    });
    stores = (await api("/stores")).stores; renderList();
    toast(`✅ ${d.success}\nAdmin: ${d.admin.email}\nPassword (save it now!): ${d.admin.password}`, 20000);
    openStore(d.id);
  } catch (e) {
    if (!retry && /already exists/.test(e.message) && confirm("That store id already exists. Re-run the clone for it?")) return cloneStore(id, true);
    toast("❌ " + e.message);
  }
}

function renderStoreDeployments(id) {
  if (!storeDeployments.length) return '<p class="muted">No deployments yet — generate a package above.</p>';
  return `<table class="mini"><thead><tr>
    <th>Version</th><th>Provider</th><th>Status</th><th>Commit</th><th>Created</th><th>Package</th><th>Advance</th></tr></thead>
    <tbody>${storeDeployments.map((d) => `<tr>
      <td><b>v${esc(d.version || "—")}</b></td>
      <td>${esc(d.provider || "local")}</td>
      <td><span class="status ${d.status === "completed" ? "active" : d.status === "failed" ? "error" : "provisioning"}">${esc(d.status || "generated")}</span></td>
      <td><code>${esc(d.gitCommit || "—")}</code></td>
      <td>${fmtTime(d.createdAt)}</td>
      <td>${d.packagePath ? `<a href="#" onclick="downloadPackage('${id}','${d._id}');return false">download</a>` : "—"}</td>
      <td>${(STATUS_NEXT[d.status] || []).map((s) => `<button class="small secondary" onclick="setDepStatus('${id}','${d._id}','${s}')">${s}</button>`).join(" ") || "—"}</td>
    </tr>`).join("")}</tbody></table>`;
}

function renderValidation(v) {
  if (!v) return "";
  const icon = (s) => (s === "ok" ? "✅" : s === "warn" ? "⚠️" : "❌");
  return `<div class="${v.ok ? "" : "locknote"}" style="${v.ok ? "font-size:13px" : ""}">
    <b>${v.ok ? "✅ Ready to generate" : "❌ Cannot generate — missing values"}</b>
    <ul class="log" style="margin-top:6px">${(v.checks || []).map((c) =>
      `<li><span>${icon(c.status)} <b>${esc(c.name)}</b>${c.detail ? ` — ${esc(c.detail)}` : ""}</span></li>`).join("")}</ul>
  </div>`;
}

async function validateDeploy(id) {
  try {
    const d = await api(`/stores/${id}/deploy/validate`);
    deployValidation = d.validation;
    $("dp_validation").innerHTML = renderValidation(d.validation);
  } catch (e) { toast("❌ " + e.message); }
}

async function generatePackage(id) {
  const btn = $("dp_go"); btn.disabled = true; btn.textContent = "Generating…";
  try {
    const d = await api(`/stores/${id}/deployments/package`, {
      method: "POST",
      body: JSON.stringify({
        provider: $("dp_provider").value,
        bump: $("dp_bump").value,
        environment: $("dp_env").value,
        notes: $("dp_notes").value.trim(),
      }),
    });
    $("dp_validation").innerHTML = renderValidation(d.validation);
    $("dp_notes").value = "";
    // refresh history + current version + activity
    const [dep, s] = await Promise.all([api(`/stores/${id}/deployments`), api(`/stores/${id}/settings`)]);
    storeDeployments = dep.deployments || []; storeMeta = s.store;
    $("depTable").innerHTML = renderStoreDeployments(id);
    toast(`✅ ${d.success} (${(d.files || []).length} files)`, 6000);
    openStore(id); // re-render (updates Current version + Overview activity)
  } catch (e) {
    // On validation failure the server refuses to generate; re-fetch the
    // validation so the operator sees exactly what's missing.
    try {
      const vd = await api(`/stores/${id}/deploy/validate`);
      $("dp_validation").innerHTML = renderValidation(vd.validation);
    } catch (_) {}
    toast("❌ " + e.message);
  }
  btn.disabled = false; btn.textContent = "Generate package";
}

async function downloadPackage(id, depId) {
  try {
    const r = await fetch(`/api/stores/${id}/deployments/${depId}/package`, {
      headers: { "x-panel-key": KEY, "x-panel-operator": OPERATOR || "panel" },
    });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || r.statusText); }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${id}-package.zip`; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  } catch (e) { toast("❌ " + e.message); }
}

async function setDepStatus(id, depId, status) {
  try {
    await api(`/stores/${id}/deployments/${depId}/status`, { method: "POST", body: JSON.stringify({ status }) });
    const dep = await api(`/stores/${id}/deployments`);
    storeDeployments = dep.deployments || [];
    $("depTable").innerHTML = renderStoreDeployments(id);
    toast(`✅ ${status}`);
  } catch (e) { toast("❌ " + e.message); }
}

/* ---------- update wizard (Phase Λ) ---------- */
const WIZARD_STEPS = ["Validate", "Backup", "Preview", "Run", "Verify", "Complete"];

function renderMigrations(items) {
  if (!items || !items.length) return '<p class="muted">No migrations run on this store yet.</p>';
  return `<table class="mini"><thead><tr><th>When</th><th>Migration</th><th>From→To</th><th>Result</th><th>Duration</th><th>Operator</th></tr></thead>
    <tbody>${items.map((m) => `<tr>
      <td>${fmtTime(m.timestamp)}</td><td>v${esc(m.migration)}</td>
      <td>v${esc(m.fromVersion || "—")}→v${esc(m.toVersion || "—")}</td>
      <td><span class="status ${m.result === "success" ? "active" : "error"}">${esc(m.result)}</span>${m.error ? ` <span class="muted">${esc(m.error)}</span>` : ""}</td>
      <td>${m.duration}ms</td><td>${esc(m.operator)}</td></tr>`).join("")}</tbody></table>`;
}

function wizardBar() {
  return `<div class="wizard-steps">${WIZARD_STEPS.map((s, i) =>
    `<div class="wstep ${i === wizardStep ? "active" : i < wizardStep ? "done" : ""}">${i + 1}. ${s}</div>`).join("")}</div>`;
}

function renderWizard(id) {
  const el = $("wizard"); if (!el) return;
  const uc = updateCheck;
  let body = "";
  if (wizardStep === 0) {
    body = `<p class="muted">Step 1 — validate this store and detect available updates. Nothing changes.</p>
      <button onclick="wizValidate('${id}')">Validate &amp; check for updates</button>`;
    if (uc) body += renderCheckResult(uc, id);
  } else if (wizardStep === 1) {
    body = `<p><b>Step 2 — Backup reminder.</b> Migrations modify the store's database.
      Take a backup first: <code>node scripts/backupDb.js</code> (see docs/DEPLOYMENT.md).</p>
      <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="wz_backup" ${wizardBackup ? "checked" : ""} onchange="wizardBackup=this.checked"/> I have taken a backup (or accept the risk)</label>
      <div style="margin-top:12px" class="row"><button class="secondary" onclick="wizGo('${id}',0)">Back</button>
        <button onclick="wizToPreview('${id}')">Continue</button></div>`;
  } else if (wizardStep === 2) {
    const pend = (uc && uc.pending) || [];
    body = `<p><b>Step 3 — Preview changes.</b> ${pend.length} migration(s) will run to bring the store to <b>v${esc(uc.latestVersion)}</b>:</p>
      <ul class="log">${pend.map((m) => `<li><span>▸ <b>v${esc(m.version)}</b> — ${esc(m.description)}</span></li>`).join("")}</ul>
      ${renderCompat(uc.compatibility)}
      <div style="margin-top:12px" class="row"><button class="secondary" onclick="wizGo('${id}',1)">Back</button>
        <button id="wz_run" onclick="wizRun('${id}')" ${uc.compatibility && !uc.compatibility.ok ? "disabled title='compatibility failed'" : ""}>Confirm &amp; run migrations</button></div>
      <p class="muted" style="margin-top:8px">Explicit confirmation required — this is not one-click.</p>`;
  } else if (wizardStep === 3) {
    body = `<p class="muted">Running migrations…</p>`;
  } else if (wizardStep === 4 || wizardStep === 5) {
    const r = wizardResult || {};
    const ok = !r.error;
    body = `<p><b>Step ${wizardStep === 4 ? "5 — Verify" : "6 — Complete"}.</b></p>
      <div class="${ok ? "" : "locknote"}"><b>${ok ? "✅ " + (r.success || "Update complete") : "❌ " + (r.error || "Update failed")}</b>
      ${r.from ? `<div class="muted">${esc(r.from)} → ${esc(r.to)}</div>` : ""}</div>
      <ul class="log">${(r.applied || []).map((a) => `<li><span>${a.result === "success" ? "✅" : "❌"} <b>v${esc(a.version)}</b> — ${esc(a.description)} <span class="muted">(${a.duration}ms)</span>${a.error ? ` — ${esc(a.error)}` : ""}</span></li>`).join("")}</ul>
      <button onclick="wizGo('${id}',0)">Done</button>`;
  }
  el.innerHTML = wizardBar() + body;
}

function renderCheckResult(uc, id) {
  if (uc.upToDate) return `<div style="margin-top:12px"><span class="badge up-to-date">up-to-date</span> Store is on the latest VCE version (v${esc(uc.latestVersion)}). Nothing to do.</div>`;
  return `<div style="margin-top:12px"><span class="badge migration-required">migration-required</span>
    v${esc(uc.currentVersion || "—")} → v${esc(uc.latestVersion)} · ${(uc.pending || []).length} migration(s).
    ${renderCompat(uc.compatibility)}
    <div style="margin-top:10px"><button onclick="wizGo('${id}',1)" ${uc.compatibility && !uc.compatibility.ok ? "disabled" : ""}>Start update →</button></div></div>`;
}

function renderCompat(c) {
  if (!c) return "";
  const icon = (s) => (s === "ok" ? "✅" : s === "warn" ? "⚠️" : "❌");
  return `<div style="margin-top:10px"><div class="muted">Compatibility ${c.ok ? "passed" : "FAILED — update blocked"}:</div>
    <ul class="log">${(c.checks || []).map((x) => `<li><span>${icon(x.status)} <b>${esc(x.name)}</b>${x.detail ? " — " + esc(x.detail) : ""}</span></li>`).join("")}</ul></div>`;
}

function wizGo(id, step) { wizardStep = step; if (step === 0) { updateCheck = null; wizardResult = null; } renderWizard(id); }
function wizToPreview(id) { if (!wizardBackup) return toast("Please confirm the backup step first"); wizardStep = 2; renderWizard(id); }

async function wizValidate(id) {
  try { updateCheck = await api(`/stores/${id}/update/check`); renderWizard(id); }
  catch (e) { toast("❌ " + e.message); }
}

async function wizRun(id) {
  wizardStep = 3; renderWizard(id);
  try {
    wizardResult = await api(`/stores/${id}/update`, { method: "POST", body: JSON.stringify({ confirm: true }) });
    wizardStep = 4;
  } catch (e) {
    wizardResult = { error: e.message, applied: [] };
    wizardStep = 4;
  }
  // refresh store meta + migration history + activity
  try {
    const [s, mig] = await Promise.all([api(`/stores/${id}/settings`), api(`/stores/${id}/migrations`)]);
    storeMeta = s.store; storeMigrations = mig.migrations || [];
    stores = (await api("/stores")).stores; renderList();
  } catch (_) {}
  renderEditor(id);
  showTab("Updates"); wizardStep = 4; renderWizard(id);
  const mt = $("migTable"); if (mt) mt.innerHTML = renderMigrations(storeMigrations);
  toast(wizardResult.error ? "❌ " + wizardResult.error : "✅ " + (wizardResult.success || "Updated"), 6000);
}

async function save(id) {
  let tokens;
  try {
    tokens = JSON.parse($("f_tokens").value || "{}");
  } catch (e) {
    return toast("❌ Design tokens JSON is invalid");
  }
  const colors = {};
  document.querySelectorAll("[data-color]").forEach((i) => {
    if (i.value.trim()) colors[i.dataset.color] = i.value.trim();
  });
  const features = {};
  document.querySelectorAll("[data-feat]").forEach((i) => (features[i.dataset.feat] = i.checked));
  const enabledProviders = [...document.querySelectorAll("[data-prov]")]
    .filter((i) => i.checked).map((i) => i.dataset.prov);
  const lockedSections = [...document.querySelectorAll("[data-lock]")]
    .filter((i) => i.checked).map((i) => i.dataset.lock);
  const stats = [...document.querySelectorAll("[data-stat]")].map((r) => ({
    value: Number(r.querySelector("[data-sv]").value) || 0,
    suffix: r.querySelector("[data-ss]").value,
    label: r.querySelector("[data-sl]").value,
  })).filter((s) => s.label);

  const body = {
    storeName: $("f_storeName").value,
    variantLabel: $("f_variantLabel").value,
    whatsappNumber: $("f_whatsappNumber").value.replace(/\D/g, ""),
    contactEmail: $("f_contactEmail").value,
    heroHeading: $("f_heroHeading").value,
    heroSubheading: $("f_heroSubheading").value,
    theme: {
      ...(S.theme || {}),
      colors,
      tokens,
      fonts: {
        body: $("f_fontBody").value,
        display: $("f_fontDisplay").value,
        googleFamilies: $("f_fontGoogle").value.split(",").map((x) => x.trim()).filter(Boolean),
      },
      motion: $("f_motion").value,
    },
    layout: { home: $("f_layoutHome").value },
    features,
    payment: { enabledProviders, defaultProvider: $("f_defaultProvider").value },
    stats,
    lockedSections,
  };
  try {
    const d = await api(`/stores/${id}/settings`, { method: "PUT", body: JSON.stringify(body) });
    S = d.settings;
    // refresh the per-store activity feed shown on Overview
    api(`/activity?storeId=${encodeURIComponent(id)}&limit=20`).then((a) => { storeActivity = a.activity || []; }).catch(() => {});
    toast("✅ Saved — live on the storefront now");
  } catch (e) {
    toast("❌ " + e.message);
  }
}

if (KEY) boot(); else $("login").style.display = "block";
</script>
